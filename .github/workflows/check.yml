name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --locked
      - run: cargo test --locked

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - run: cargo test --locked
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-windows-x86_64
          path: target/debug/scrawl.exe

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build clang \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-randr0-dev libxcb-composite0-dev libxcb-xinput-dev \
            libxcb-xtest0-dev libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libdbus-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            patchelf file gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-pipewire
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Build the AppImage
        run: ./scripts/linux/appimage.sh target/debug/scrawl
      - uses: actions/upload-artifact@v5
        with:
          name: scrawl-linux-x86_64
          path: target/appimage/Scrawl-x86_64.AppImage
