name: Release (Linux)

on:
  pull_request:
    paths:
      - .github/workflows/release-linux.yml
      - scripts/linux/**
      - packaging/linux/**
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach to. Empty builds the branch without publishing.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}-${{ inputs.tag }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install build and packaging dependencies
        run: ./scripts/linux/dependencies.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
          cache-on-failure: true
      - run: cargo build --release --locked
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml $version" >&2
            exit 1
          fi
          ./scripts/linux/appimage.sh target/release/scrawl
          name="Scrawl-$version-linux-${{ matrix.arch }}.AppImage"
          mkdir -p dist
          cp "target/appimage/Scrawl-${{ matrix.arch }}.AppImage" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: AppImage runs headless without FUSE
        run: APPIMAGE_EXTRACT_AND_RUN=1 "dist/${{ steps.package.outputs.name }}" --help
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Mac/Windows job may create it concurrently. Re-read on a create conflict.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "Scrawl ${TAG#v}" --notes "Release notes to follow." || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/* --clobber
